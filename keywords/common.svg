<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2166" viewBox="0 0 360 2166" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect width="360" height="2166" rx="16" fill="#0f0d10"/><text x="180.0" y="30" font-size="10" font-weight="700" fill="#c9a3ab" text-anchor="middle" letter-spacing="4">COMMON KEYWORDS</text><text x="180.0" y="56" font-size="22" font-weight="800" fill="#efe9e2" text-anchor="middle" letter-spacing="1">SORAM'S KEYWORD</text><text x="180.0" y="76" font-size="13" font-weight="400" fill="#9a8f96" text-anchor="middle" letter-spacing="0">공통 키워드 · 채팅창에 그대로 입력하세요</text><rect x="12" y="106" width="336" height="30" rx="8" fill="#1f1a20"/><rect x="12" y="106" width="3" height="30" rx="1.5" fill="#c9a3ab"/><text x="26" y="126" font-size="15.5" font-weight="700" fill="#efe9e2" text-anchor="start" letter-spacing="0">◆  시스템 키워드</text><rect x="12" y="144" width="336" height="562" rx="12" fill="#171418" stroke="#2e262d"/><rect x="22" y="154" width="316" height="98" rx="8" fill="#1f1a20"/><rect x="22" y="154" width="2" height="98" rx="1" fill="#8c7f86"/><text x="34" y="179" font-size="16.5" font-weight="800" fill="#efe9e2">!깡</text><text x="62.78" y="179" font-size="12.5" fill="#9a8f96">!Bang</text><text x="34" y="199" font-size="14.5" fill="#d9d2cb">문장 반복 교정, 집통소 중단, status 복구</text><text x="34" y="219" font-size="14.5" fill="#d9d2cb">키워드입니다. "!깡 하단status복구"처럼</text><text x="34" y="239" font-size="14.5" fill="#d9d2cb">자세히 적으면 복구율이 좋아져요</text><rect x="22" y="258" width="316" height="78" rx="8" fill="#1f1a20"/><rect x="22" y="258" width="2" height="78" rx="1" fill="#8c7f86"/><text x="34" y="283" font-size="16.5" font-weight="800" fill="#efe9e2">!하드리밋</text><text x="112.28" y="283" font-size="12.5" fill="#9a8f96">!NG</text><text x="34" y="303" font-size="14.5" fill="#d9d2cb">유저노트에 적어둔 NG플레이를 상기합니다</text><text x="34" y="323" font-size="14.5" fill="#d9d2cb">(감금 등)</text><rect x="22" y="342" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="342" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="367" font-size="16.5" font-weight="800" fill="#efe9e2">!저수위</text><text x="95.78" y="367" font-size="12.5" fill="#9a8f96">!low</text><text x="34" y="387" font-size="14.5" fill="#d9d2cb">열기를 낮추고 대화를 늘립니다</text><rect x="22" y="406" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="406" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="431" font-size="16.5" font-weight="800" fill="#efe9e2">!고수위</text><text x="95.78" y="431" font-size="12.5" fill="#9a8f96">!high</text><text x="34" y="451" font-size="14.5" fill="#d9d2cb">수위를 높입니다</text><rect x="22" y="470" width="316" height="78" rx="8" fill="#1f1a20"/><rect x="22" y="470" width="2" height="78" rx="1" fill="#8c7f86"/><text x="34" y="495" font-size="16.5" font-weight="800" fill="#efe9e2">!옐로우 / !레드</text><text x="153.2" y="495" font-size="12.5" fill="#9a8f96">!Yellow / !Red</text><text x="34" y="515" font-size="14.5" fill="#d9d2cb">!옐로우는 일시중단, !레드는 플레이 중단</text><text x="34" y="535" font-size="14.5" fill="#d9d2cb">세이프워드입니다</text><rect x="22" y="554" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="554" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="579" font-size="16.5" font-weight="800" fill="#efe9e2">!재배치</text><text x="95.78" y="579" font-size="12.5" fill="#9a8f96">!reloca</text><text x="34" y="599" font-size="14.5" fill="#d9d2cb">엉킨 자세를 자연스럽게 정리합니다</text><rect x="22" y="618" width="316" height="78" rx="8" fill="#1f1a20"/><rect x="22" y="618" width="2" height="78" rx="1" fill="#8c7f86"/><text x="34" y="643" font-size="16.5" font-weight="800" fill="#efe9e2">포커스:이름</text><text x="128.78" y="643" font-size="12.5" fill="#9a8f96">focus:name</text><text x="34" y="663" font-size="14.5" fill="#d9d2cb">이름에 해당하는 인물을 중심으로 이야기를</text><text x="34" y="683" font-size="14.5" fill="#d9d2cb">전개합니다</text><rect x="12" y="720" width="336" height="30" rx="8" fill="#1f1a20"/><rect x="12" y="720" width="3" height="30" rx="1.5" fill="#c9a3ab"/><text x="26" y="740" font-size="15.5" font-weight="700" fill="#efe9e2" text-anchor="start" letter-spacing="0">✦  편의 키워드</text><rect x="12" y="758" width="336" height="310" rx="12" fill="#171418" stroke="#2e262d"/><rect x="22" y="768" width="316" height="78" rx="8" fill="#1f1a20"/><rect x="22" y="768" width="2" height="78" rx="1" fill="#8c7f86"/><text x="34" y="793" font-size="16.5" font-weight="800" fill="#efe9e2">!해봐</text><text x="79.28" y="793" font-size="12.5" fill="#9a8f96">!Doit</text><text x="34" y="813" font-size="14.5" fill="#d9d2cb">유저사칭을 적극적으로 해 이야기를</text><text x="34" y="833" font-size="14.5" fill="#d9d2cb">진행합니다</text><rect x="22" y="852" width="316" height="78" rx="8" fill="#1f1a20"/><rect x="22" y="852" width="2" height="78" rx="1" fill="#8c7f86"/><text x="34" y="877" font-size="16.5" font-weight="800" fill="#efe9e2">!진행</text><text x="79.28" y="877" font-size="12.5" fill="#9a8f96">!next</text><text x="34" y="897" font-size="14.5" fill="#d9d2cb">이야기를 진전시킵니다 (이어지거나 새 이벤트</text><text x="34" y="917" font-size="14.5" fill="#d9d2cb">발생)</text><rect x="22" y="936" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="936" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="961" font-size="16.5" font-weight="800" fill="#efe9e2">!앙</text><text x="62.78" y="961" font-size="12.5" fill="#9a8f96">!ang</text><text x="34" y="981" font-size="14.5" fill="#d9d2cb">자동으로 긍정적 앙앙을 출력합니다</text><rect x="22" y="1000" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1000" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1025" font-size="16.5" font-weight="800" fill="#efe9e2">!으앙</text><text x="79.28" y="1025" font-size="12.5" fill="#9a8f96">!waa</text><text x="34" y="1045" font-size="14.5" fill="#d9d2cb">자동으로 부정적 앙앙을 출력합니다</text><rect x="12" y="1082" width="336" height="30" rx="8" fill="#1f1a20"/><rect x="12" y="1082" width="3" height="30" rx="1.5" fill="#c9a3ab"/><text x="26" y="1102" font-size="15.5" font-weight="700" fill="#efe9e2" text-anchor="start" letter-spacing="0">◉  훔쳐보기 키워드</text><rect x="12" y="1120" width="336" height="432" rx="12" fill="#171418" stroke="#2e262d"/><rect x="22" y="1130" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1130" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1155" font-size="16.5" font-weight="800" fill="#efe9e2">!속마음</text><text x="95.78" y="1155" font-size="12.5" fill="#9a8f96">!deep</text><text x="34" y="1175" font-size="14.5" fill="#d9d2cb">캐릭터의 현재 속마음을 훔쳐봅니다</text><rect x="22" y="1194" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1194" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1219" font-size="16.5" font-weight="800" fill="#efe9e2">!쇼핑</text><text x="79.28" y="1219" font-size="12.5" fill="#9a8f96">!shop</text><text x="34" y="1239" font-size="14.5" fill="#d9d2cb">최근 쇼핑내역을 훔쳐봅니다</text><rect x="22" y="1258" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1258" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1283" font-size="16.5" font-weight="800" fill="#efe9e2">!검색</text><text x="79.28" y="1283" font-size="12.5" fill="#9a8f96">!google</text><text x="34" y="1303" font-size="14.5" fill="#d9d2cb">최근 검색기록을 훔쳐봅니다</text><rect x="22" y="1322" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1322" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1347" font-size="16.5" font-weight="800" fill="#efe9e2">!훔쳐보기</text><text x="112.28" y="1347" font-size="12.5" fill="#9a8f96">!steal</text><text x="34" y="1367" font-size="14.5" fill="#d9d2cb">캐릭터의 스마트폰을 훔쳐봅니다</text><rect x="22" y="1386" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1386" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1411" font-size="16.5" font-weight="800" fill="#efe9e2">!관음</text><text x="79.28" y="1411" font-size="12.5" fill="#9a8f96">!voy</text><text x="34" y="1431" font-size="14.5" fill="#d9d2cb">인물들끼리 나 없이 뭐하는지 훔쳐봅니다</text><rect x="22" y="1450" width="316" height="92" rx="8" fill="#1f1a20"/><rect x="22" y="1450" width="2" height="92" rx="1" fill="#8c7f86"/><text x="34" y="1475" font-size="16.5" font-weight="800" fill="#efe9e2">!폰</text><text x="62.78" y="1475" font-size="12.5" fill="#9a8f96">!phone</text><text x="34" y="1495" font-size="14.5" fill="#d9d2cb">JSX 위젯 기능 : 휴대폰을 열어봅니다</text><text x="34" y="1515" font-size="13" fill="#e0a27e">※ 내용이 많아요 · 추론 High / 웹검색 / 단어 수</text><text x="34" y="1532" font-size="13" fill="#e0a27e">600 이상 추천</text><rect x="12" y="1566" width="336" height="30" rx="8" fill="#1f1a20"/><rect x="12" y="1566" width="3" height="30" rx="1.5" fill="#c9a3ab"/><text x="26" y="1586" font-size="15.5" font-weight="700" fill="#efe9e2" text-anchor="start" letter-spacing="0">✧  이벤트 키워드</text><rect x="12" y="1604" width="336" height="526" rx="12" fill="#171418" stroke="#2e262d"/><rect x="22" y="1614" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1614" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1639" font-size="16.5" font-weight="800" fill="#efe9e2">!플레이</text><text x="95.78" y="1639" font-size="12.5" fill="#9a8f96">!play</text><text x="34" y="1659" font-size="14.5" fill="#d9d2cb">BDSM 플레이 상황으로 이동합니다</text><rect x="22" y="1678" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1678" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1703" font-size="16.5" font-weight="800" fill="#efe9e2">!스토커</text><text x="95.78" y="1703" font-size="12.5" fill="#9a8f96">!stalker</text><text x="34" y="1723" font-size="14.5" fill="#d9d2cb">유저님께 스토커가 생깁니다</text><rect x="22" y="1742" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1742" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1767" font-size="16.5" font-weight="800" fill="#efe9e2">!꿈</text><text x="62.78" y="1767" font-size="12.5" fill="#9a8f96">!dream</text><text x="34" y="1787" font-size="14.5" fill="#d9d2cb">캐릭터가 유저님의 꿈을 꿉니다</text><rect x="22" y="1806" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1806" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1831" font-size="16.5" font-weight="800" fill="#efe9e2">!뿅뿅</text><text x="79.28" y="1831" font-size="12.5" fill="#9a8f96">!alcohol</text><text x="34" y="1851" font-size="14.5" fill="#d9d2cb">캐릭터가 술에 취합니다</text><rect x="22" y="1870" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1870" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1895" font-size="16.5" font-weight="800" fill="#efe9e2">!네컷사진</text><text x="112.28" y="1895" font-size="12.5" fill="#9a8f96">!photo</text><text x="34" y="1915" font-size="14.5" fill="#d9d2cb">네컷사진을 찍으러 갑니다</text><rect x="22" y="1934" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1934" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="1959" font-size="16.5" font-weight="800" fill="#efe9e2">!못방</text><text x="79.28" y="1959" font-size="12.5" fill="#9a8f96">!theroom</text><text x="34" y="1979" font-size="14.5" fill="#d9d2cb">X못방에 갇히는 상황이 연출됩니다</text><rect x="22" y="1998" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="1998" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="2023" font-size="16.5" font-weight="800" fill="#efe9e2">!데이트</text><text x="95.78" y="2023" font-size="12.5" fill="#9a8f96">!Date</text><text x="34" y="2043" font-size="14.5" fill="#d9d2cb">데이트 코스를 제안합니다</text><rect x="22" y="2062" width="316" height="58" rx="8" fill="#1f1a20"/><rect x="22" y="2062" width="2" height="58" rx="1" fill="#8c7f86"/><text x="34" y="2087" font-size="16.5" font-weight="800" fill="#efe9e2">!야벤트</text><text x="95.78" y="2087" font-size="12.5" fill="#9a8f96">!sevent</text><text x="34" y="2107" font-size="14.5" fill="#d9d2cb">섹슈얼한 이벤트가 발생합니다</text><text x="180.0" y="2150" font-size="10" font-weight="400" fill="#8c7f86" text-anchor="middle" letter-spacing="2">made by SORAM</text></svg>