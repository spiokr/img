<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2234" viewBox="0 0 360 2234" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect width="360" height="2234" rx="16" fill="#f4f5f6"/><text x="14.0" y="26.0" font-size="12.5" font-weight="700" fill="#13a35c" text-anchor="start">SORAM이 사용하는</text><text x="14.0" y="50.0" font-size="19" font-weight="800" fill="#1a1a1a" text-anchor="start">설정 가이드</text><text x="14.0" y="70.0" font-size="12.5" font-weight="400" fill="#8b8b8b" text-anchor="start">채팅방 설정을 열고 STEP 순서대로 똑같이 맞춰 주세요</text><rect x="10" y="94" width="340" height="476" rx="16" fill="#ffffff"/><rect x="24.0" y="109.0" width="53.6" height="18.0" rx="9" fill="#1a1a1a" /><text x="50.8" y="122.0" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">STEP 1</text><text x="84.6" y="122.0" font-size="14" font-weight="800" fill="#1a1a1a" text-anchor="start">모델 고르기</text><text x="24.0" y="142.0" font-size="11.5" font-weight="400" fill="#a3a3a3" text-anchor="start">설정 › LLM 설정의 모델 칸을 눌러 아래 중 하나를 선택</text><rect x="24.0" y="160.0" width="312.0" height="48.0" rx="12" fill="#f4f5f6" /><text x="38.0" y="189.0" font-size="15" font-weight="400" fill="#8a63d2" text-anchor="start">✦</text><text x="58.0" y="181.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Gemini 3.8 flash</text><text x="58.0" y="197.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">첫 턴 50리프 내외</text><rect x="239.6" y="174.0" width="86.4" height="20.0" rx="10" fill="#e7f8ef" /><text x="282.8" y="187.8" font-size="10.5" font-weight="700" fill="#13a35c" text-anchor="middle">★ 가성비 최고</text><rect x="24.0" y="214.0" width="312.0" height="48.0" rx="12" fill="#f4f5f6" /><text x="38.0" y="243.0" font-size="15" font-weight="400" fill="#8a63d2" text-anchor="start">✦</text><text x="58.0" y="235.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Gemini 4 argon</text><text x="58.0" y="251.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">첫 턴 150리프 내외</text><rect x="250.2" y="228.0" width="75.8" height="20.0" rx="10" fill="#e7f8ef" /><text x="288.1" y="241.8" font-size="10.5" font-weight="700" fill="#13a35c" text-anchor="middle">★ 밸런스 굿</text><rect x="24.0" y="268.0" width="312.0" height="48.0" rx="12" fill="#f4f5f6" /><text x="38.0" y="297.0" font-size="15" font-weight="400" fill="#d97757" text-anchor="start">✧</text><text x="58.0" y="289.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Claude Opus 4.6</text><text x="58.0" y="305.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">첫 턴 250리프 내외</text><rect x="254.8" y="282.0" width="71.2" height="20.0" rx="10" fill="#fbeee8" /><text x="290.4" y="295.8" font-size="10.5" font-weight="700" fill="#c25a3a" text-anchor="middle">★ 문체 2픽</text><rect x="24.0" y="322.0" width="312.0" height="48.0" rx="12" fill="#f4f5f6" /><text x="38.0" y="351.0" font-size="15" font-weight="400" fill="#d97757" text-anchor="start">✧</text><text x="58.0" y="343.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Claude Opus 5</text><text x="58.0" y="359.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">첫 턴 320리프 내외</text><rect x="254.8" y="336.0" width="71.2" height="20.0" rx="10" fill="#fbeee8" /><text x="290.4" y="349.8" font-size="10.5" font-weight="700" fill="#c25a3a" text-anchor="middle">★ 문체 1픽</text><rect x="24.0" y="376.0" width="312.0" height="48.0" rx="12" fill="#f4f5f6" /><text x="38.0" y="405.0" font-size="15" font-weight="400" fill="#9b7be0" text-anchor="start">✧</text><text x="58.0" y="397.0" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Claude Fable 5</text><text x="58.0" y="413.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">첫 턴 600리프 내외</text><rect x="244.3" y="390.0" width="81.7" height="20.0" rx="10" fill="#1a1a1a" /><text x="285.1" y="403.8" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">★ 문체 0순위</text><text x="24.0" y="438.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">· 5개 모두 SORAM이 주로 테스트하는 모델이에요</text><text x="24.0" y="458.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">· 비용은 첫 턴 대화 기준 (페르소나 800자, 유저노트 0자)</text><text x="24.0" y="478.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">· Fable 5는 문체 0순위지만 가격도 최상이에요</text><rect x="24.0" y="502.0" width="312.0" height="58.0" rx="12" fill="#fbeee8" /><text x="36.0" y="524.0" font-size="12" font-weight="700" fill="#c25a3a" text-anchor="start">✨ 맨 처음 대화는 오푸스~페이블 추천드려요!</text><text x="36.0" y="544.0" font-size="12" font-weight="400" fill="#7a3b26" text-anchor="start">초반의 전체적인 흐름이 좋아져요.</text><rect x="10" y="580" width="340" height="607" rx="16" fill="#ffffff"/><rect x="24.0" y="595.0" width="53.6" height="18.0" rx="9" fill="#1a1a1a" /><text x="50.8" y="608.0" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">STEP 2</text><text x="84.6" y="608.0" font-size="14" font-weight="800" fill="#1a1a1a" text-anchor="start">LLM 설정</text><text x="24.0" y="628.0" font-size="11.5" font-weight="400" fill="#a3a3a3" text-anchor="start">초록색·검은색으로 칠해진 칸만 똑같이 눌러 주세요</text><rect x="24.0" y="648.0" width="312.0" height="36.0" rx="12" fill="#f4f5f6" /><rect x="180.0" y="651.0" width="153.0" height="30.0" rx="10" fill="#13c46c" /><text x="103.5" y="671.0" font-size="13" font-weight="400" fill="#8b8b8b" text-anchor="middle">정량제</text><text x="256.5" y="671.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">종량제</text><rect x="24.0" y="696.0" width="312.0" height="1.0" rx="0" fill="#eeeeee" /><text x="24.0" y="716.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">최대 토큰</text><text x="336.0" y="716.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">제한 없음</text><text x="24.0" y="735.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">답변이 중간에 잘리지 않아요</text><rect x="32.0" y="755.0" width="296.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="32.0" y="755.0" width="296.0" height="6.0" rx="3" fill="#13c46c" /><circle cx="328.0" cy="758" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="24.0" y="785.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">추론 길이</text><text x="24.0" y="804.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">설정과 흐름을 더 꼼꼼히 챙겨요</text><rect x="24.0" y="822.0" width="312.0" height="36.0" rx="12" fill="#f4f5f6" /><rect x="180.0" y="825.0" width="153.0" height="30.0" rx="10" fill="#222222" /><text x="103.5" y="845.0" font-size="13" font-weight="400" fill="#8b8b8b" text-anchor="middle">Low</text><text x="256.5" y="845.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">High</text><text x="24.0" y="886.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">출력 길이 지침</text><rect x="314.0" y="870.0" width="22.0" height="22.0" rx="6" fill="#13c46c" /><text x="325.0" y="886.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="24.0" y="905.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">너무 짧지도 길지도 않은 분량이에요. 평균 2~4000자 정도</text><text x="24.0" y="923.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">나와요!</text><rect x="24.0" y="945.0" width="121.0" height="34.0" rx="8" fill="#f4f5f6" /><text x="84.5" y="967.0" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="middle">600</text><text x="157.0" y="967.0" font-size="13" font-weight="400" fill="#8b8b8b" text-anchor="middle">~</text><rect x="169.0" y="945.0" width="121.0" height="34.0" rx="8" fill="#f4f5f6" /><text x="229.5" y="967.0" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="middle">2000</text><text x="336.0" y="967.0" font-size="11" font-weight="400" fill="#a3a3a3" text-anchor="end">(단어)</text><text x="24.0" y="1003.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">웹 검색</text><rect x="314.0" y="987.0" width="22.0" height="22.0" rx="6" fill="#13c46c" /><text x="325.0" y="1003.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="24.0" y="1022.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">!폰 위젯 쓸 때 특히 추천해요</text><rect x="24.0" y="1048.0" width="312.0" height="1.0" rx="0" fill="#eeeeee" /><text x="24.0" y="1072.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">로어북 주입 한도</text><text x="336.0" y="1072.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">5,000자</text><text x="24.0" y="1091.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">로어북=키워드북이에요. 키워드북에는 '!깡' 같은 키워드</text><text x="24.0" y="1109.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">프롬프트와 '주변인물설정'이 들어가 있어요. 평균</text><text x="24.0" y="1127.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">5,000자면 충분하나, 다인을 원하시면 한 명당 2,000자</text><text x="24.0" y="1145.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">정도 추가해 주세요.</text><rect x="32.0" y="1165.0" width="296.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="32.0" y="1165.0" width="14.8" height="6.0" rx="3" fill="#13c46c" /><circle cx="46.8" cy="1168" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><rect x="10" y="1197" width="340" height="1023" rx="16" fill="#ffffff"/><rect x="24.0" y="1212.0" width="53.6" height="18.0" rx="9" fill="#1a1a1a" /><text x="50.8" y="1225.0" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">STEP 3</text><text x="84.6" y="1225.0" font-size="14" font-weight="800" fill="#1a1a1a" text-anchor="start">단기 기억 설정</text><text x="24.0" y="1245.0" font-size="11.5" font-weight="400" fill="#a3a3a3" text-anchor="start">LLM 설정 맨 아래 › 를 눌러 열고, 막대를 초록 숫자에 맞춰</text><text x="24.0" y="1261.0" font-size="11.5" font-weight="400" fill="#a3a3a3" text-anchor="start">주세요</text><text x="24.0" y="1285.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">최근 대화 기억 설정</text><text x="336.0" y="1285.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">10턴</text><text x="24.0" y="1304.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">높을수록 이전 턴 대화를 많이 기억해서 기억력이 정말</text><text x="24.0" y="1322.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">좋아져요. 그치만 느려지고 비싸져요!</text><rect x="32.0" y="1342.0" width="296.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="32.0" y="1342.0" width="133.2" height="6.0" rx="3" fill="#13c46c" /><circle cx="165.2" cy="1345" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="24.0" y="1370.0" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">나머지는 대화 스타일에 맞춰 골라 주세요 👇</text><rect x="24" y="1382" width="312" height="291" rx="14" fill="#f4f5f6"/><text x="36.0" y="1410.0" font-size="17" font-weight="400" fill="#1a1a1a" text-anchor="start">☕</text><text x="64.0" y="1406.0" font-size="14" font-weight="800" fill="#1a1a1a" text-anchor="start">가볍고 짧게 대화하시는 분은</text><text x="64.0" y="1423.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">잡담은 걸러내고 굵직한 사건만 기억해요</text><rect x="32" y="1440" width="296" height="225" rx="12" fill="#ffffff"/><text x="46.0" y="1464.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">단기 기억 생성 주기</text><text x="314.0" y="1464.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">10턴</text><text x="46.0" y="1483.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">길게 잡아서 굵직한 사건만 모아 요약해요</text><rect x="54.0" y="1503.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1503.0" width="161.3" height="6.0" rx="3" fill="#13c46c" /><circle cx="215.3" cy="1506" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="46.0" y="1535.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">단기 기억 활성화 개수</text><text x="314.0" y="1535.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">20개</text><text x="46.0" y="1554.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">요약을 넉넉히 꺼내 써서 오래전 일도 이어가요</text><rect x="54.0" y="1574.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1574.0" width="75.6" height="6.0" rx="3" fill="#13c46c" /><circle cx="129.6" cy="1577" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="46.0" y="1606.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">대화 당 요약 글자 수</text><text x="314.0" y="1606.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">100자 / 턴</text><text x="46.0" y="1625.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">짧게 요약해서 잡담은 걸러내고 핵심만 남겨요</text><rect x="54.0" y="1645.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1645.0" width="100.8" height="6.0" rx="3" fill="#13c46c" /><circle cx="154.8" cy="1648" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><rect x="24" y="1683" width="312" height="291" rx="14" fill="#f4f5f6"/><text x="36.0" y="1711.0" font-size="17" font-weight="400" fill="#1a1a1a" text-anchor="start">📚</text><text x="64.0" y="1707.0" font-size="14" font-weight="800" fill="#1a1a1a" text-anchor="start">꽉 채운 뚱뚱한 서사를 즐기는 분은</text><text x="64.0" y="1724.0" font-size="11.5" font-weight="400" fill="#8b8b8b" text-anchor="start">감정선과 디테일까지 꼼꼼히 기억해요</text><rect x="32" y="1741" width="296" height="225" rx="12" fill="#ffffff"/><text x="46.0" y="1765.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">단기 기억 생성 주기</text><text x="314.0" y="1765.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">7턴</text><text x="46.0" y="1784.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">적당히 자주 요약해서 흐름을 놓치지 않아요</text><rect x="54.0" y="1804.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1804.0" width="108.4" height="6.0" rx="3" fill="#13c46c" /><circle cx="162.4" cy="1807" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="46.0" y="1836.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">단기 기억 활성화 개수</text><text x="314.0" y="1836.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">20개</text><text x="46.0" y="1855.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">요약을 넉넉히 꺼내 써서 오래전 일도 이어가요</text><rect x="54.0" y="1875.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1875.0" width="75.6" height="6.0" rx="3" fill="#13c46c" /><circle cx="129.6" cy="1878" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><text x="46.0" y="1907.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">대화 당 요약 글자 수</text><text x="314.0" y="1907.0" font-size="13" font-weight="700" fill="#13a35c" text-anchor="end">200자 / 턴</text><text x="46.0" y="1926.0" font-size="12" font-weight="400" fill="#8b8b8b" text-anchor="start">길게 요약해서 감정선·약속·복선까지 남겨요</text><rect x="54.0" y="1946.0" width="252.0" height="6.0" rx="3" fill="#e8e8e8" /><rect x="54.0" y="1946.0" width="252.0" height="6.0" rx="3" fill="#13c46c" /><circle cx="306.0" cy="1949" r="7.5" fill="#ffffff" stroke="#13c46c" stroke-width="3"/><rect x="24.0" y="1984.0" width="312.0" height="58.0" rx="12" fill="#f4f5f6" /><text x="36.0" y="2006.0" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">🧠 기억력이 중요하시다면</text><text x="36.0" y="2026.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">단기 기억 활성화 개수를 최대로 설정해 주세요.</text><rect x="24.0" y="2050.0" width="312.0" height="76.0" rx="12" fill="#f4f5f6" /><text x="36.0" y="2072.0" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">📌 생성 주기는 최근 대화 기억(10턴) 이하로!</text><text x="36.0" y="2092.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">더 길게 잡으면 요약도 원문도 아닌 대화가 생길 수</text><text x="36.0" y="2110.0" font-size="12" font-weight="400" fill="#5f5f5f" text-anchor="start">있어요.</text><rect x="24.0" y="2134.0" width="312.0" height="76.0" rx="12" fill="#e7f8ef" /><text x="36.0" y="2156.0" font-size="12" font-weight="700" fill="#13a35c" text-anchor="start">💡 리프 아끼는 팁</text><text x="36.0" y="2176.0" font-size="12" font-weight="400" fill="#1f6b45" text-anchor="start">종량제는 숫자를 올릴수록 리프가 더 들어요. 아끼고</text><text x="36.0" y="2194.0" font-size="12" font-weight="400" fill="#1f6b45" text-anchor="start">싶다면 추론 Low나 로어북 한도부터 낮춰 보세요.</text></svg>